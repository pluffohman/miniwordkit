[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miniwordkit"
version = "0.1.0"
description = "A tiny collection of simple text utilities."
readme = "README.md"
requires-python = ">=3.9"
authors = [ {name = "Matvey Kiselev"} ]

[tool.setuptools.packages.find]
where = ["src"]
